 const rows=sales.map(x=>`<button class="sales-row ${x.id===s.id?'active':''}" data-sale="${x.id}"><span><span class="sales-title">${x.title}</span><span class="sales-sub">${x.sub}</span></span><span class="stage">${status(x.stage,x.stageType)}</span><span class="owner"><span class="avatar">${x.owner}</span>${x.ownerName}</span><span class="last-signal">${x.signal}</span><span>${icon('chevron','s')}</span></button>`).join('');
 return `<div class="page-inner">${pageHeader('Рабочий контекст продаж','Не воронка ради отчёта, а следующий понятный шаг','Система связывает коммуникации, знания и задачи вокруг реального обращения или инициативы.',`<button class="btn" data-toast="Представление|Сейчас показаны активные обращения и инициативы">${icon('filter','s')}Активные</button><button class="btn primary" data-toast="Новая запись|В рабочей версии запись создаётся из CRM или обращения">${icon('sales','s')}Добавить</button>`)}
 <section class="sales-layout"><div class="sales-table"><div class="table-head"><span>Контекст</span><span>Состояние</span><span>Ответственный</span><span>Последний сигнал</span><span></span></div>${rows}</div><aside class="sales-inspector"><div class="sales-inspector-head">${status(s.stage,s.stageType)}<h2>${s.title}</h2><p>${s.context}</p></div><div class="sales-inspector-body"><section class="inspector-section"><div class="section-label">Потребность</div><p class="lead-copy">${s.need}</p></section><section class="inspector-section"><div class="section-label">Следующий шаг</div><div class="next-step"><b>${s.next}</b><span>Связанная задача видна ответственному</span></div><button class="btn primary compact" style="margin-top:9px" data-toast="Карточка открыта|Следующий шаг готов к работе">Открыть задачу</button></section><section class="inspector-section"><div class="section-label">Связанный контекст</div><div class="data-chips">${s.sources.map(x=>`<span class="data-chip">${icon(x==='CRM'?'crm':x==='Разговор'?'phone':x==='Почта'?'message':x==='Документы'||x.includes('Инструкция')?'doc':x==='Каталог'?'database':x==='Встреча'?'meeting':'task','s')}${x}</span>`).join('')}</div></section><section class="inspector-section"><div class="section-label">Последние события</div><div class="timeline">${s.timeline.map(t=>`<div class="timeline-row"><span class="timeline-time">${t[0]}</span><span class="timeline-axis"><span class="timeline-dot"></span></span><span class="timeline-copy"><b>${t[1]}</b><span>${t[2]}</span></span></div>`).join('')}</div></section></div></aside></section></div>`;

function renderPage(){
 renderNav(); const meta=pageMeta[state.page]; $('#breadcrumbPage').textContent=meta[0];
 const renderer={overview:renderOverview,communications:renderCommunications,knowledge:renderKnowledge,sales:renderSales,processes:renderProcesses,analytics:renderAnalytics}[state.page];
 $('#page').innerHTML=renderer(); $('#page').scrollTop=0;
}
function navigate(id){ if(!pageMeta[id])return; state.page=id; $('#app').classList.remove('sidebar-open'); closePalette(); renderPage(); }
function knowledgeRun(){
 const q=($('#knowledgeInput')?.value||'').trim(); state.knowledgeQuery=q||state.knowledgeQuery;
 const low=state.knowledgeQuery.toLowerCase(); state.knowledgeMode=low.includes('возврат')?'return':(low.includes('вниман')||low.includes('обращен')||low.includes('crm'))?'crm':'analogue'; state.source=0;
 const box=$('.search-workbench'); if(box)box.classList.add('skeleton'); setTimeout(()=>{renderPage();toast('Ответ собран','Использованы доступные рабочие источники')},420);
}
const paletteCommands=[
 ...navItems.map(n=>({label:n.label,meta:'Раздел',icon:n.icon,action:()=>navigate(n.id)})),
 {label:'Задать вопрос корпоративным знаниям',meta:'Действие',icon:'search',action:()=>{navigate('knowledge');setTimeout(()=>$('#knowledgeInput')?.focus(),10)}},
 {label:'Открыть событие, требующее решения',meta:'Событие',icon:'alert',action:()=>{state.page='overview';state.event='ev-attention';state.inspector=true;renderPage()}},
 {label:'Посмотреть процесс после разговора',meta:'Процесс',icon:'process',action:()=>{state.page='processes';state.process='proc-call';renderPage()}},
 {label:'Открыть повторяющийся запрос',meta:'Вывод',icon:'analytics',action:()=>{state.page='analytics';state.insight='ins-demand';renderPage()}}
];
let paletteFiltered=[...paletteCommands];
function renderPalette(q=''){const low=q.trim().toLowerCase();paletteFiltered=paletteCommands.filter(x=>!low||x.label.toLowerCase().includes(low)||x.meta.toLowerCase().includes(low));$('#paletteResults').innerHTML=`<div class="palette-label">${low?'Результаты':'Быстрый переход'}</div>${paletteFiltered.map((x,i)=>`<button class="palette-item ${i===0?'active':''}" data-command="${i}">${icon(x.icon,'s')}<span>${x.label}</span><small>${x.meta}</small></button>`).join('')||`<div class="empty-state">${icon('search')}<b>Ничего не найдено</b><span>Попробуйте более общий запрос.</span></div>`}`}
function openPalette(){renderPalette();$('#paletteBackdrop').classList.add('open');setTimeout(()=>{$('#paletteInput').value='';$('#paletteInput').focus()},0)}
function closePalette(){$('#paletteBackdrop').classList.remove('open')}
document.addEventListener('click',e=>{
 const nav=e.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return}
 const event=e.target.closest('[data-event]');if(event){state.event=event.dataset.event;state.inspector=true;renderPage();return}
 const close=e.target.closest('[data-close-inspector]');if(close){state.inspector=false;renderPage();return}
 const filter=e.target.closest('[data-filter]');if(filter){state.eventFilter=filter.dataset.filter;const pool=events.filter(x=>state.eventFilter==='all'||(state.eventFilter==='attention'?x.attention:!x.attention));if(pool.length)state.event=pool[0].id;renderPage();return}
 const preset=e.target.closest('[data-preset]');if(preset){state.knowledgeMode=preset.dataset.preset;state.knowledgeQuery=knowledgeAnswers[state.knowledgeMode].query;state.source=0;renderPage();return}
 if(e.target.closest('[data-knowledge-run]')){knowledgeRun();return}
 if(e.target.closest('[data-focus-knowledge]')){$('#knowledgeInput')?.focus();return}
 const source=e.target.closest('[data-source]');if(source){state.source=Number(source.dataset.source);renderPage();return}
 const comm=e.target.closest('[data-comm]');if(comm){state.comm=comm.dataset.comm;renderPage();return}
 const process=e.target.closest('[data-process]');if(process){state.process=process.dataset.process;renderPage();return}
 const toggle=e.target.closest('[data-toggle-process]');if(toggle){const p=processes.find(x=>x.id===toggle.dataset.toggleProcess);if(p){p.on=!p.on;p.status=p.on?'Работает':'Выключен';p.statusType=p.on?'done':'info';renderPage();toast(p.on?'Процесс включён':'Процесс выключен',p.name)}return}
 const run=e.target.closest('[data-run-process]');if(run){const p=processes.find(x=>x.id===run.dataset.runProcess);toast('Тестовый запуск завершён',p?.name||'Процесс');return}
 const insight=e.target.closest('[data-insight]');if(insight){state.insight=insight.dataset.insight;renderPage();return}
 const sale=e.target.closest('[data-sale]');if(sale){state.sale=sale.dataset.sale;renderPage();return}
 const tc=e.target.closest('[data-toast]');if(tc){const [t,c]=tc.dataset.toast.split('|');toast(t,c||'');return}
 const cmd=e.target.closest('[data-command]');if(cmd){const c=paletteFiltered[Number(cmd.dataset.command)];if(c){closePalette();c.action()}return}
 if(e.target.id==='paletteBackdrop')closePalette();
});
$('#commandTrigger').addEventListener('click',openPalette);
$('#mobileMenu').addEventListener('click',()=>$('#app').classList.add('sidebar-open'));
$('#sidebarScrim').addEventListener('click',()=>$('#app').classList.remove('sidebar-open'));
$('#paletteInput').addEventListener('input',e=>renderPalette(e.target.value));
$('#paletteInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&paletteFiltered[0]){e.preventDefault();closePalette();paletteFiltered[0].action()}});
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#paletteBackdrop').classList.contains('open')?closePalette():openPalette()}
 if(e.key==='Escape'){closePalette();$('#app').classList.remove('sidebar-open')}
 if(e.key==='Enter'&&document.activeElement?.id==='knowledgeInput'){knowledgeRun()}
});
renderPage();
</script>
</body>
</html>
